<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | Iran Market Signaling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a1929;
            --bg-card: rgba(30, 41, 54, 0.92);
            --text-primary: #ffffff;
            --text-secondary: #b0bec5;
            --text-muted: #78909c;
            --border-color: rgba(0, 212, 255, 0.22);
            --accent-primary: #00d4ff;
            --accent-secondary: #0088ff;
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #0088ff 100%);
        }
        [data-theme="light"] {
            --bg-primary: #f0f4f8;
            --bg-card: rgba(255, 255, 255, 0.97);
            --text-primary: #1a1a1a;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --border-color: rgba(0, 0, 0, 0.12);
        }
        * { box-sizing: border-box; }
        html, body {
            min-height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem 5rem;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 136, 255, 0.08) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }
        .login-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2rem 2rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
        }
        .login-card::before {
            content: '';
            display: block;
            height: 4px;
            border-radius: 4px 4px 0 0;
            margin: -2.5rem -2rem 1.75rem;
            background: var(--gradient-primary);
        }
        .brand-block {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.4));
        }
        .brand-title-fa {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.5;
            margin: 0 0 0.35rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-title-en {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 0 0 1rem;
            letter-spacing: 0.02em;
        }
        .brand-sub-fa {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin: 0;
        }
        .brand-sub-en {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0.25rem 0 0;
        }
        .form-label { color: var(--text-secondary); font-size: 0.9rem; }
        .form-control {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 12px;
            padding: 0.65rem 1rem;
        }
        [data-theme="light"] .form-control {
            background: #fff;
            color: #1a1a1a;
        }
        .form-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
        }
        .input-group-text {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--accent-primary);
            border-radius: 12px 0 0 12px;
        }
        [dir="rtl"] .input-group-text {
            border-radius: 0 12px 12px 0;
        }
        .btn-login {
            background: var(--gradient-primary);
            border: none;
            color: #0a1929;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 12px;
            width: 100%;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            filter: brightness(1.08);
            color: #0a1929;
        }
        .theme-chip {
            position: absolute;
            top: 0;
            left: 0;
            right: auto;
        }
        [dir="rtl"] .theme-chip {
            left: auto;
            right: 0;
        }
        .theme-chip button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 50px;
            padding: 0.35rem 0.85rem;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .theme-chip button:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        .login-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(10, 25, 41, 0.85);
            border-top: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            z-index: 2;
        }
        [data-theme="light"] .login-footer {
            background: rgba(255, 255, 255, 0.92);
        }
        .login-footer .en {
            display: block;
            margin-top: 0.35rem;
            font-size: 0.72rem;
            opacity: 0.9;
        }
        .alert { border-radius: 12px; font-size: 0.9rem; }
    </style>
</head>
<body data-theme="dark">
    <div class="login-shell position-relative">
        <div class="theme-chip">
            <button type="button" id="loginThemeBtn" onclick="toggleLoginTheme()" title="Theme / تم">🌙 / ☀️</button>
        </div>
        <div class="login-card">
            <div class="brand-block">
                <div class="brand-icon" aria-hidden="true">📊</div>
                <h1 class="brand-title-fa">نرم‌افزار سیگنالینگ بورس ایران</h1>
                <p class="brand-title-en">Iran Stock Exchange Signaling Software</p>
                <p class="brand-sub-fa">شرکت فراز انرژی پیشرو</p>
                <p class="brand-sub-en">Faraz Energy Pishro Company</p>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 mb-3" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('login') }}" novalidate>
                <input type="hidden" name="next" value="{{ next_param|e }}">

                <div class="mb-3">
                    <label class="form-label" for="username">نام کاربری <span class="text-muted" style="font-size:0.8rem;">/ Username</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">رمز عبور <span class="text-muted" style="font-size:0.8rem;">/ Password</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-login">ورود <span style="opacity:0.85;">/ Sign in</span></button>
            </form>
        </div>
    </div>

    <footer class="login-footer">
        <span>طراحی شده و توسعه‌یافته توسط شرکت ریلای</span>
        <span class="en">Designed and developed by RelAI Company</span>
    </footer>

    <script>
        function toggleLoginTheme() {
            var b = document.body;
            var t = b.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            b.setAttribute('data-theme', t);
            try { localStorage.setItem('theme', t); } catch (e) {}
        }
        (function () {
            try {
                var s = localStorage.getItem('theme');
                if (s === 'light' || s === 'dark') document.body.setAttribute('data-theme', s);
            } catch (e) {}
        })();
    </script>
</body>
</html>
